services:
  - type: web
    name: elhelb-ai-chatbot
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ELHELB_VAULT_KEY
        generateValue: true
      - key: ELHELB_ADMIN_KEY
        generateValue: true
