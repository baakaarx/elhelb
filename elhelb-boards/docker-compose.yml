services:
  elhelb-boards:
    build: .
    container_name: elhelb-boards
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DB_PATH=/data/elhelb-boards.db
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD:-}
      - TRUST_PROXY=${TRUST_PROXY:-0}
    volumes:
      - elhelb_boards_data:/data

volumes:
  elhelb_boards_data:
