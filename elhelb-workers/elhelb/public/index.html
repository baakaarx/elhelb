<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قاعدة بيانات العاملين</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="hd"><img class="lg" src="/logo.png" alt="ELHELB GROUP"><div class="tt">قاعدة بيانات العاملين</div><div class="st">Employees Database</div></header><div class="bar"></div>
<div class="w">
<div class="c"><div class="ch">بيانات العامل</div>
<label for="n">الاسم بالكامل</label><input type="text" id="n" autocomplete="name">
<label for="p">رقم التليفون</label><input type="tel" id="p" inputmode="tel" autocomplete="tel">
<label for="f">صورة البطاقة - الوش</label><input type="file" id="f" accept="image/*">
<label for="b">صورة البطاقة - الظهر</label><input type="file" id="b" accept="image/*">
<label for="d">مسوغات التعيين (ممكن أكتر من ملف)</label><input type="file" id="d" accept="image/*,application/pdf" multiple>
<button id="s">إرسال البيانات</button><div class="m" id="msg"></div></div>
<div style="text-align:center"><a class="hl" href="/hr">دخول الموارد البشرية</a></div>
</div>
<script src="/index.js"></script></body></html>
